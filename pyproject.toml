[project]
name = "sportevidence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GoncaGomes", email = "goncalocfg@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "markitdown[docx,pdf,xlsx]>=0.1.8",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.5",
]

[project.scripts]
sportevidence = "sportevidence.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
